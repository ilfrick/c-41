---
# Darkroom – docker-compose
#
# Default (recommended) — the cargo-only Rust image (no CMake, no GPU compute):
#   docker compose -f docker/docker-compose.yml build darkroom
#   docker compose -f docker/docker-compose.yml up darkroom
#
# Device-passthrough profiles use the FULL C+Rust image (docker/Dockerfile.full-c).
# The launched c41-rs GTK4 application is currently CPU-only; the C darktable
# OpenCL kernels are not called by it. These profiles do not enable GPU compute
# in the C-41 product.
#   docker compose -f docker/docker-compose.yml --profile nvidia up darkroom-nvidia
#   docker compose -f docker/docker-compose.yml --profile amd up darkroom-amd
#   docker compose -f docker/docker-compose.yml --profile intel up darkroom-intel
#
# Environment variables (set in .env or inline):
#   PUID        – host user ID for file ownership     (default: 1000)
#   PGID        – host group ID                       (default: 1000)
#   TZ          – timezone                            (default: Europe/Rome)
#   PHOTOS_DIR  – path to your photos on the host     (default: ~/Pictures)
#   CONFIG_DIR  – path for persistent config/cache    (default: ~/.config/darkroom-docker)

x-common: &common
  labels:
    # Keep watchtower's auto-update away from this container. It monitors every
    # container by default, and pulling a new base image recreates this one —
    # which wipes anything installed into the running container (the X tooling
    # the visual-verification loop needs) and reverts a hot-copied c41-rs
    # binary to whatever the image ships, mid-session and with no warning.
    # Updates here are a rebuild (`docker compose build darkroom`), not a pull.
    com.centurylinklabs.watchtower.enable: "false"
  environment:
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    TZ: ${TZ:-Europe/Rome}
    DARKROOM_CONFIGDIR: /config/darkroom
    DARKROOM_CACHEDIR: /config/cache
  volumes:
    - ${PHOTOS_DIR}:/photos
    - ${CONFIG_DIR}:/config
  ports:
    - "3000:3000"   # KasmVNC HTTP  → open http://localhost:3000
    - "3001:3001"   # KasmVNC HTTPS → open https://localhost:3001
  restart: unless-stopped

# The full C+Rust build (CMake) is used by the device-passthrough profiles.
# It includes C darktable/OpenCL binaries, but the container entrypoint launches
# c41-rs, which currently performs image processing on CPU only.
x-full-build: &full-build
  build:
    context: ..
    dockerfile: docker/Dockerfile.full-c
    args:
      CMAKE_BUILD_TYPE: Release
      USE_AI: "OFF"
      JOBS: "4"
  security_opt:
    - seccomp:unconfined   # required for ptrace inside the C container
  shm_size: "2gb"

services:

  # ── Default: cargo-only Rust image (works everywhere, no GPU/CMake) ────────
  darkroom:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: darkroom
    image: darkroom:latest

  # ── NVIDIA device passthrough (full C image; c41-rs remains CPU-only) ───────
  # Prerequisites on host:
  #   1. NVIDIA driver installed
  #   2. nvidia-container-toolkit installed and configured
  #      https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/
  #   3. Docker daemon restarted after toolkit install
  # Verify: docker run --rm --gpus all nvidia/cuda:12.0-base nvidia-smi
  darkroom-nvidia:
    <<: [*common, *full-build]
    container_name: darkroom-nvidia
    image: darkroom:nvidia
    profiles: [nvidia]
    runtime: nvidia
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Rome}
      DARKROOM_CONFIGDIR: /config/darkroom
      DARKROOM_CACHEDIR: /config/cache
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility,video
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, video]

  # ── AMD device passthrough (full C image; c41-rs remains CPU-only) ─────────
  # Prerequisites on host:
  #   1. ROCm installed: https://rocm.docs.amd.com/
  #   2. User in 'video' and 'render' groups: sudo usermod -aG video,render $USER
  # Verify: rocm-smi  (or clinfo | grep "Device Name")
  darkroom-amd:
    <<: [*common, *full-build]
    container_name: darkroom-amd
    image: darkroom:amd
    profiles: [amd]
    devices:
      - /dev/dri:/dev/dri    # DRM render nodes
      - /dev/kfd:/dev/kfd    # ROCm compute interface
    group_add:
      - video
      - render

  # ── Intel device passthrough (full C image; c41-rs remains CPU-only) ───────
  # Prerequisites on host:
  #   1. Intel OpenCL runtime: sudo apt install intel-opencl-icd
  #   2. User in 'video' and 'render' groups: sudo usermod -aG video,render $USER
  # Verify: clinfo | grep "Device Name"
  darkroom-intel:
    <<: [*common, *full-build]
    container_name: darkroom-intel
    image: darkroom:intel
    profiles: [intel]
    devices:
      - /dev/dri:/dev/dri    # DRM render nodes (includes renderD128 for compute)
    group_add:
      - video
      - render

volumes:
  darkroom-config:
