[package]
name = "c41-ui"
version = "0.1.0"
edition = "2021"
description = "GTK4 + libadwaita UI shell — incrementally replaces src/views, src/libs, src/gui"

[dependencies]
c41-core = { workspace = true }
c41-db   = { workspace = true }
anyhow        = { workspace = true }
tracing       = { workspace = true }
gtk4          = { version = "0.9", features = ["v4_12"] }
adw           = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
glib          = "0.20"
gio           = "0.20"
rusqlite      = { workspace = true }
walkdir       = { workspace = true }
# Rust-native export encode (8/16-bit PNG/TIFF, 8-bit JPEG) + resize. Only the
# formats we emit, to keep the dependency light.
image         = { version = "0.25", default-features = false, features = ["png", "tiff", "jpeg"] }
# u16→bytes cast for the 16-bit encode primitive (G2b: `save_rgb16_buf` had to
# leave `ImageBuffer::save_with_format`, which has no ICC surface, for explicit
# encoders + `ImageEncoder::set_icc_profile`). Pinned like rawloader/kamadak-exif:
# a byte reinterpretation any wrong-layout version would silently corrupt.
bytemuck      = "=1.25.0"
# XMP sidecar writing (m4-142): event-stream XML reader/writer for merge-preserving
# updates of darktable-compatible sidecars next to image files.
quick-xml     = "0.38"
# Slippy-map tile fetches (u5): blocking HTTPS client used exclusively inside
# `gio::spawn_blocking`. Pure-Rust rustls TLS, no system library, so the
# shipping image needs no change.
ureq          = { workspace = true }
