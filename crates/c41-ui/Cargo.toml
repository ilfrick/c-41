[package]
name = "c41-ui"
version = "0.1.0"
edition = "2021"
description = "GTK4 + libadwaita UI shell — incrementally replaces src/views, src/libs, src/gui"

[dependencies]
c41-core = { workspace = true }
c41-db   = { workspace = true }
anyhow        = { workspace = true }
tracing       = { workspace = true }
gtk4          = { version = "0.9", features = ["v4_12"] }
adw           = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
glib          = "0.20"
gio           = "0.20"
rusqlite      = { workspace = true }
walkdir       = { workspace = true }
# Rust-native export encode (8/16-bit PNG/TIFF, 8-bit JPEG) + resize. Only the
# formats we emit, to keep the dependency light.
image         = { version = "0.25", default-features = false, features = ["png", "tiff", "jpeg"] }
