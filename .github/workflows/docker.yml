name: Docker Build & Publish

on:
  push:
    branches: [master]
    tags: ["release-*"]
  pull_request:
    branches: [master]
    paths:
      - "docker/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/darkroom

jobs:
  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=match,pattern=release-(.+),group=1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # docker/Dockerfile is cargo-only (milestone 5) — it uses only
          # CACHEBUST (+ optional DARKROOM_REPO/BRANCH). The old CMake args
          # (CMAKE_BUILD_TYPE/USE_AI/JOBS) live in docker/Dockerfile.full-c now.
          build-args: |
            CACHEBUST=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # Opt-in full C+Rust image (heic/heif/avif export + the C GUI/darktable-cli).
  # Since :latest went cargo-only (m5), this preserves the full image in the
  # registry as :full-c — published ON DEMAND only (the CMake C build is heavy,
  # not worth per-push) and doubles as a build-guard so Dockerfile.full-c can't
  # silently rot.
  docker-full-c:
    name: Build & push full C+Rust image (:full-c, on demand)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (full-c)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.full-c
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:full-c
          build-args: |
            CMAKE_BUILD_TYPE=Release
            USE_AI=ON
            JOBS=4
            CACHEBUST=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
