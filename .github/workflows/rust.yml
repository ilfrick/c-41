name: Rust

on:
  push:
    branches: [master]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check + test + clippy
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # c41-ui pulls in gtk4 + libadwaita; without their system dev
      # packages cargo can't even type-check the workspace. Cairo / pango /
      # gdk-pixbuf / graphene cover the transitive crates; clang/libclang are
      # for any future bindgen consumer. c41-sys links liblensfun (m4-130);
      # the -data package feeds its probe test. NOTE: unlike Docker RUN
      # instructions, Actions passes this script verbatim to bash, which does
      # NOT strip `#` lines inside backslash continuations — comments must
      # stay outside the continued command.
      - name: Install GTK4 + Adwaita system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libgraphene-1.0-dev \
            libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libsqlite3-dev libssl-dev zlib1g-dev libclang-dev clang \
            libfontconfig-dev libfreetype-dev pkg-config \
            liblensfun-dev liblensfun-data-v1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --component clippy
          rustup override set stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # `cargo check` proves the whole workspace type-checks (including the
      # GTK4 c41-ui crate and the c41-rs binary).
      - name: cargo check
        run: cargo check --workspace

      # Full unit-test sweep. `--release` keeps the runtime within the
      # default 6h job budget on the larger crates.
      - name: cargo test
        run: cargo test --workspace --release

      # Clippy at *default* strictness: catches actual bugs (incorrect
      # constant precision, dead unsafe, etc.) without enforcing the
      # ~150 stylistic lints (`# Safety` docstrings, range loops, …)
      # that would force a one-shot rewrite of every existing IOP.
      # Tighten this once the bulk of the migration lands.
      - name: cargo clippy
        run: cargo clippy --workspace

      # Cargo-native build of the standalone GTK4 app binary (milestone 5 —
      # retire CMake): guarantees the real, shippable `c41-rs` links with
      # pure cargo + system GTK4 (no CMake, no C darktable). `cargo check` only
      # type-checks (no link), and `cargo test` links `main.rs` only as a
      # zero-test harness under `--cfg test` — it never produces the real
      # non-test executable. In the full container image the binary is only built
      # after the heavy CMake C build, so this is the sole place the shippable
      # artifact's final link is exercised. Placed LAST so it reuses the release
      # dep rlibs `cargo test --release` already built (marginal cost ≈ the link,
      # not a full release codegen).
      - name: cargo-native app binary build
        run: cargo build --release -p c41 --bin c41-rs
